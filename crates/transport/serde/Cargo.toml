[package]
name = "lightyear_serde"
version = "0.28.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "IO primitives for the lightyear networking library"
repository = "https://github.com/cBournhonesque/lightyear"

[features]
default = ["std"]
std = ["bitcode/std", "bytes/std", "no_std_io2/std"]
no_std = ["dep:bincode"]

[dependencies]
# utils
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
variadics_please.workspace = true

# serde
bitcode.workspace = true
serde.workspace = true
bincode = { version = "2.0.1", default-features = false, optional = true, features = [
  "serde",
  "alloc",
] }

# bevy
bevy_derive.workspace = true
bevy_ecs = { workspace = true, features = ["bevy_reflect"] }
bevy_platform.workspace = true
bevy_ptr.workspace = true
bevy_reflect.workspace = true
bevy_utils.workspace = true

# no_std
no_std_io2.workspace = true

[dev-dependencies]
test-log.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
