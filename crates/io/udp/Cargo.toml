[package]
name = "lightyear_udp"
version = "0.30.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "IO primitives for the lightyear networking library"
repository = "https://github.com/cBournhonesque/lightyear"

[features]
default = []
## Enables multi-peer endpoints without selecting a server role.
p2p = ["bevy_platform"]
server = ["bevy_platform"]
metrics = ["dep:metrics"]
test_utils = []
## Peer discovery over UDP: a peer endpoint that a `lightyear_p2p::Lobby` dials through. Optional so
## that an application using the transport without peer discovery pays nothing for it.
## `server` because the endpoint is the UDP fan-out machinery, which still lives under that module.
lobby = ["server", "dep:lightyear_p2p", "dep:lightyear_connection"]

[dependencies]
lightyear_core.workspace = true
lightyear_link.workspace = true
lightyear_utils.workspace = true
lightyear_p2p = { workspace = true, optional = true, features = ["std"] }
lightyear_connection = { workspace = true, optional = true, features = ["client"] }

aeronet_io.workspace = true

metrics = { workspace = true, optional = true }
tracing.workspace = true

# bevy
bevy_app.workspace = true
bevy_ecs = { workspace = true, features = ["std"] }
bevy_platform = { workspace = true, optional = true }

# utils
bytes.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
