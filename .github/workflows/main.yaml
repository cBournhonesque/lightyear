name: Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - ".github/dependabot.yml"
      - "**.md"
  pull_request:
    paths-ignore:
      - ".gitignore"
      - ".github/dependabot.yml"
      - "**.md"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings -C debuginfo=line-tables-only
  RUSTDOCFLAGS: --deny warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          wayland: true
          xkb: true

      - name: Install Taplo
        run: cargo install --locked taplo-cli

      - name: Format
        run: |
          cargo fmt --all --check
          taplo fmt --check

      - name: Clippy lightyear
        run: cargo clippy --features=lightyear_core/not_mock,avian3d/f32 --workspace --exclude=compiletime --exclude=avian_3d --exclude=launcher --exclude=delta_compression --exclude=distributed_authority --no-deps -- -D warnings -A clippy::needless_lifetimes

  docs:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          wayland: true
          xkb: true

      - name: Rustdoc
        env:
          # Must match [package.metadata.docs.rs]
          RUSTFLAGS: --cfg docsrs_dep -A mismatched_lifetime_syntaxes
          RUSTDOCFLAGS: --cfg=docsrs
        run: cargo +nightly doc --all-features --workspace --features "avian2d/2d avian2d/f32 avian3d/3d avian3d/f32" --document-private-items --no-deps --keep-going

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --deny warnings -C debuginfo=line-tables-only -A mismatched_lifetime_syntaxes
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # This workspace contains many internal library crates that can be
          # reused when a change only touches part of Lightyear.
          cache-workspace-crates: true

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          wayland: true
          xkb: true

      - name: Crate and integration tests
        shell: bash
        env:
          CARGO_INCREMENTAL: 0
        run: |
          set -euo pipefail
          package_args=()
          while IFS= read -r package; do
            case "$package" in
              lightyear_avian3d) continue ;;
            esac
            package_args+=(-p "$package")
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.manifest_path | test("/crates/")) | .name' \
              | sort -u
          )
          cargo test --locked --no-fail-fast --lib --tests "${package_args[@]}" -- --test-threads=1
          cargo test --locked --no-fail-fast -p lightyear_avian3d --lib

      - name: Test doc
        run: cargo test --locked --workspace --doc --all-features --no-fail-fast

  coverage:
    name: Coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --deny warnings -C debuginfo=line-tables-only -A mismatched_lifetime_syntaxes
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Activate CI cargo config
        run: mv .cargo/config_ci.toml .cargo/config.toml

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: true
          cache-workspace-crates: true

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          wayland: true
          xkb: true

      - name: Install Tarpaulin
        run: cargo install --locked cargo-tarpaulin

      - name: Generate code coverage
        run: >
          cargo tarpaulin --locked -p lightyear_tests
          --engine llvm
          --skip-clean
          --out lcov
          -- --test-threads=1

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
