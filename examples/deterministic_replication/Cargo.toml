[package]
name = "deterministic_replication"
version = "0.30.0"
authors = ["Charles Bournhonesque <charlesbour@gmail.com>"]
edition.workspace = true
publish = false

[features]
default = ["client", "gui", "server", "p2p", "netcode", "webtransport"]
client = ["lightyear/client", "lightyear_examples_common/client"]
gui = ["lightyear_examples_common/gui2d"]
server = [
  "lightyear/client",
  "lightyear/server",
  "lightyear_examples_common/client",
  "lightyear_examples_common/server",
]
netcode = ["lightyear_examples_common/netcode"]
p2p = [
  "client",
  "udp",
  "lightyear/deterministic",
  "lightyear/p2p",
  "lightyear_deterministic_replication/p2p",
  "lightyear_examples_common/p2p",
]
# Replication-based catch-up: an existing peer serves a state snapshot to a newcomer instead of
# the newcomer replaying the session's inputs. Sending replicated state from a peer needs the
# Replicon server backend, which is why this is not part of `p2p`.
p2p-replication-catchup = [
  "p2p",
  "lightyear/client",
  "lightyear/server",
  "lightyear_deterministic_replication/replication",
  "lightyear_deterministic_replication/server",
]
webtransport = ["lightyear_examples_common/webtransport"]
udp = ["lightyear_examples_common/udp", "lightyear/std", "lightyear/udp"]

[dependencies]
lightyear = { workspace = true, features = [
  "interpolation",
  "prediction",
  "replication",
  "leafwing",
  "deterministic",
] }
lightyear_deterministic_replication.workspace = true
lightyear_examples_common = { workspace = true, features = [
  "structured-debug",
] }
lightyear_frame_interpolation.workspace = true
leafwing-input-manager.workspace = true
# add avian2d directly to customize the plugin 
lightyear_avian2d = { workspace = true, features = ["deterministic", "2d"] }
avian2d = { workspace = true, features = [
  "2d",
  "f32",
  "parry-f32",
  "serialize",
  "enhanced-determinism",
] }

serde.workspace = true
bevy.workspace = true
bevy_replicon.workspace = true

[package.metadata.bevy_cli.web]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
default-features = false
features = ["client", "gui", "netcode", "webtransport"]

[lints]
workspace = true
